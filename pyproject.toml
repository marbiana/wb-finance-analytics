[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wb-finance-analytics"
version = "0.1.0"
description = "Демонстрационная аналитика детализированных финансовых отчётов Wildberries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wb-finance = "wb_finance_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

